name: release

# A version of package.json not tagged yet, once on master (the commit of `bun run release`, squashed with its pull request):
# the checks again, then its tag and its GitHub release with its CHANGELOG notes, which the dashboards installed read to tell
# that a new version is out.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.tag.outputs.new }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          v=$(jq -r .version package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]] || git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is a pre-release or already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version's notes, from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## / { if (on) exit; on = index($0, "## " v " ") == 1 || $0 == "## " v; next } on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Squad dashboard $VERSION" --notes-file notes.md
