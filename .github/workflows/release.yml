name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged"
            exit 0
          fi
          awk -v v="$v" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --notes-file notes.md
