<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed; --surface-3: #e9e8e3;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --border-strong: rgba(11,11,11,0.18);
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
  --p0: #2a78d6; --p1: #eb6834; --p2: #1baf7a; --p3: #eda100; --p4: #e87ba4; --p5: #008300; --p6: #4a3aa7; --p7: #e34948;
  --good: #0ca30c; --good-text: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --seq-1: #cde2fb;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
    --p0: #3987e5; --p1: #d95926; --p2: #199e70; --p3: #c98500; --p4: #d55181; --p5: #008300; --p6: #9085e9; --p7: #e66767;
    --good-text: #0ca30c; --seq-1: #0d366b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
  --p0: #3987e5; --p1: #d95926; --p2: #199e70; --p3: #c98500; --p4: #d55181; --p5: #008300; --p6: #9085e9; --p7: #e66767;
  --good-text: #0ca30c; --seq-1: #0d366b;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 16px 56px; }
header.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--border); }
header.top .wrap { padding-bottom: 0; }
.top-row { display: flex; align-items: center; gap: 12px; padding: 12px 0 4px; flex-wrap: wrap; }
.brand { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.ok .dot { background: var(--good); }
.live.running .dot { background: var(--accent); animation: pulse 1.2s infinite; }
.live.error .dot { background: var(--critical); }
.live.stale .dot { background: var(--warning); }
.stale-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 2px; padding: 7px 12px; border-radius: 8px; font-size: 13px; color: var(--ink);
  background: color-mix(in srgb, var(--warning) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warning) 50%, transparent); }
.stale-banner[hidden] { display: none; }
.stale-banner .ico { color: var(--p3); font-weight: 700; }
.stale-banner .btn { padding: 3px 10px; font-size: 12.5px; margin-left: auto; }
.version-banner { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.version-banner .ico { color: var(--accent); }
.app-changes { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .live.running .dot { animation: none; } .flash > * { animation: none !important; } }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.icon-btn { padding: 5px 7px; color: var(--ink-2); }
.btn.icon-btn svg { display: block; width: 18px; height: 18px; }
.btn.more { margin: 14px auto 0; display: flex; }
.icon-sun { display: none !important; }
:root[data-theme="dark"] .icon-sun { display: block !important; }
:root[data-theme="dark"] .icon-moon { display: none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .icon-sun { display: block !important; }
  :root:not([data-theme="light"]) .icon-moon { display: none !important; }
}
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .seg button:focus-visible, .line:focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab.me { margin-left: auto; }
main { padding-top: 20px; }
section[hidden] { display: none; }
h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.005em; }
h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.cols-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); align-items: start; }
.card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head > div:first-child { flex: 1; min-width: 0; }
.card-head .sub { margin: 0; }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.toolbar .push { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: baseline; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg .n { font-size: 11.5px; opacity: 0.7; font-variant-numeric: tabular-nums; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip-sep { width: 1px; height: 22px; background: var(--border-strong); margin: 0 4px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
input[type="search"], input[type="text"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 5px 9px; }
input[type="search"] { width: 260px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.linkish:hover { text-decoration: underline; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; line-height: 18px; border: 1px solid var(--border-strong); color: var(--ink-2); white-space: nowrap; background: var(--surface); }
.badge .ico { font-size: 10px; line-height: 1; }
.st-merged .ico { color: var(--good); }
.st-open .ico { color: var(--accent); }
.st-closed .ico, .st-wip .ico, .st-draft .ico { color: var(--muted); }
.st-review .ico { color: var(--p6); }
.rtag { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; line-height: 18px; padding: 0 7px; border-radius: 4px; color: var(--ink); white-space: nowrap; background: var(--surface-2); text-decoration: none; }
.rtag.rplus { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.rtag.validation { background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
.rtag.changes { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); }
.rtag.comment { color: var(--ink-2); }
.rtag.fw-merged { background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
.rtag.fw-open { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); }
.rtag.fw-blocked { background: color-mix(in srgb, var(--serious) 22%, var(--surface)); }
.rtag.fw-closed { color: var(--muted); text-decoration: line-through; }
a.rtag:hover { outline: 1px solid var(--border-strong); text-decoration: none; }
a.rtag.fw-closed:hover { text-decoration: line-through; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.empty { color: var(--muted); padding: 28px; text-align: center; margin: 0; }
.dash { color: var(--muted); }

/* One item on one line: icon, title cut to the width, a short meta on the right. */
.lines { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.line { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 3px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.line:hover { background: var(--surface-2); }
.line .ico { width: 14px; flex: none; text-align: center; font-size: 11px; }
.line .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .meta { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ico.open { color: var(--accent); }
.ico.draft, .ico.wip { color: var(--ink-2); font-size: 12px; }
.ico.merged { color: var(--good); }
.ico.port { color: var(--p3); }
.ico.rplus { color: var(--accent); }
.ico.validation { color: var(--good); }
.ico.changes { color: var(--p3); }
.ico.comment { color: var(--muted); }

/* The squad on one screen: one row per person, what they are on, merged and reviewed side by side. */
.board { display: grid; grid-template-columns: 150px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.board > div { display: contents; }
.board > div > * { padding: 12px 16px; border-top: 1px solid var(--grid); min-width: 0; }
.board > .bhead > * { border-top: 0; padding-top: 10px; padding-bottom: 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.board > div > * + * { border-left: 1px solid var(--grid); }
.board .person { display: flex; flex-direction: column; gap: 4px; }
.board .person .name { display: inline-flex; gap: 8px; align-items: center; font-weight: 650; font-size: 14px; }
.board .person .links { display: flex; gap: 10px; padding-left: 18px; }
.lines .cell-more { margin-top: 2px; align-self: flex-start; }
.legend-icons { display: inline-flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-icons .ico { margin-right: 3px; }
@media (max-width: 900px) {
  .board { grid-template-columns: 1fr; }
  .board > .bhead { display: none; }
  .board > div > * + * { border-left: 0; border-top: 0; padding-top: 0; }
  .board > div > *[data-label]::before { content: attr(data-label); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; margin: 4px 0 2px; }
}

/* Work: features written and reviewed. Every cell starts on the same top line. */
.work-grid { display: grid; grid-template-columns: 104px minmax(280px, 2.6fr) 156px minmax(170px, 1.3fr) minmax(150px, 1.1fr) 96px; }
.work-grid > div { display: contents; }
.work-grid > div > * { padding: 11px 10px; border-top: 1px solid var(--grid); min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; align-items: flex-start; }
.work-grid > .head > * { border-top: 0; padding-top: 4px; padding-bottom: 8px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.work-grid > .row { cursor: pointer; }
.work-grid > .row:hover > * { background: var(--surface-2); }
.work-grid > .row.given { cursor: default; }
.work-grid > .row.given > * { background: color-mix(in srgb, var(--p6) 3.5%, var(--surface)); }
.work-grid > .row.given:hover > * { background: color-mix(in srgb, var(--p6) 6%, var(--surface)); }
.work-grid > .row[aria-expanded="true"] > * { background: var(--surface-2); border-bottom: 0; }
.work-grid .who { flex-direction: column; gap: 3px; font-size: 13px; }
.work-grid .who > span { display: inline-flex; gap: 6px; align-items: center; line-height: 20px; }
.work-grid .feat { flex-direction: column; flex-wrap: nowrap; gap: 3px; }
.work-grid .feat .title { font-size: 13.5px; font-weight: 500; line-height: 20px; display: flex; gap: 6px; align-items: baseline; }
.work-grid .feat .caret { color: var(--muted); font-size: 10px; width: 10px; flex: none; }
.work-grid .feat .meta { font-size: 12px; color: var(--muted); padding-left: 16px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.work-grid .when { flex-direction: column; align-items: flex-end; text-align: right; font-size: 12.5px; color: var(--ink-2); gap: 0; line-height: 20px; }
.work-grid .when .muted { font-size: 11.5px; line-height: 16px; }
.work-grid > .detail > div { grid-column: 1 / -1; display: block; background: var(--surface-2); border-top: 0; padding: 4px 18px 16px 30px; }
.work-grid > .flash > * { animation: flash 2.4s ease-out; }
@keyframes flash { from { background: var(--accent-wash); } to { background: transparent; } }
@media (max-width: 1000px) {
  .work-grid { grid-template-columns: 1fr 1fr; }
  .work-grid > .head { display: none; }
  .work-grid .feat { grid-column: 1 / -1; order: -1; }
}
.legend-line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.legend-line > span { display: inline-flex; gap: 4px; align-items: center; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px 28px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
.list { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
.list li { padding: 2px 0; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.list .d { color: var(--muted); width: 76px; flex: none; font-variant-numeric: tabular-nums; }
.list .i { width: 14px; flex: none; text-align: center; color: var(--muted); }
.list .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin: 8px 0 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.copy-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 12px; border-radius: 4px; }
.copy-btn:hover { color: var(--ink); background: var(--surface-3); }

.timeline .day { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; padding: 16px 4px 6px; border-bottom: 1px solid var(--border-strong); }
.timeline .day:first-child { padding-top: 0; }
.timeline .ev { display: grid; grid-template-columns: 46px 104px 150px minmax(0, 1fr); gap: 12px; padding: 7px 4px; border-bottom: 1px solid var(--grid); align-items: baseline; font-size: 13px; }
.timeline .ev .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.timeline .ev .who { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.timeline .ev .what { color: var(--ink-2); }
.timeline .ev .txt { min-width: 0; }
.timeline .ev .txt .muted { font-size: 12px; }
@media (max-width: 760px) { .timeline .ev { grid-template-columns: 46px 1fr; } input[type="search"] { width: 100%; } }

/* Me */
.queue .line { padding-top: 5px; padding-bottom: 5px; }
.queue .who-tag { display: inline-flex; gap: 5px; align-items: center; width: 74px; flex: none; font-size: 12.5px; }
.my-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 900px) { .my-board { grid-template-columns: 1fr; gap: 16px; } }

.rev-grid { display: grid; grid-template-columns: 110px minmax(0, 1fr); }
.rev-grid > * { padding: 9px 0; border-top: 1px solid var(--grid); min-width: 0; }
.rev-grid > :nth-child(-n+2) { border-top: 0; }
.rev-grid .who { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.chip.rev { padding: 2px 10px 2px 8px; font-size: 12.5px; }
.chip.rev .n { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.rev .kinds { display: inline-flex; gap: 2px; }
.chip.rev .kinds i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

.todo-form { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
.todo-form textarea, .todos textarea.edit, dialog.todo-dialog textarea { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 10px; resize: vertical; box-sizing: border-box; }
.todo-form textarea { flex: 1; min-width: 0; min-height: 34px; }
.todos { list-style: none; margin: 0; padding: 0; }
.todos li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 6px; margin: 0 -6px; border-top: 1px solid var(--grid); font-size: 13.5px; border-radius: 6px; }
.todos li:first-child { border-top: 0; }
.todos li.attention { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
.todos input[type="checkbox"] { margin: 3px 0 0; cursor: pointer; }
.todos .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.todos .ref-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.todos .comment { white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; line-height: 1.45; }
.todos .meta { font-size: 11.5px; color: var(--muted); }
.todos li.done .comment, .todos li.done .ref-chip .l { color: var(--muted); text-decoration: line-through; }
.todos .acts { display: inline-flex; gap: 2px; opacity: 0; }
.todos li:hover .acts, .todos .acts button:focus-visible { opacity: 1; }
.todos .acts button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 5px; border-radius: 4px; font-size: 14px; line-height: 1.3; }
.todos .acts button:hover { color: var(--ink); background: var(--surface-2); }
.todos .acts button.del:hover { color: var(--critical); }
.todos textarea.edit { width: 100%; min-height: 64px; }
.ref-chip { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; cursor: pointer; color: var(--ink); text-align: left; }
.ref-chip:hover { border-color: var(--border-strong); background: var(--surface-3); }
.ref-chip .i { flex: none; font-size: 11px; }
.ref-chip .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ref-chip .k { flex: none; color: var(--muted); font-size: 11.5px; }
.ref-feature .i { color: var(--accent); }
.ref-pr .i { color: var(--p6); }
.ref-journey .i { color: var(--p2); }

    renderSetup();
  };
  const dirty = Object.keys(L.edits).length > 0;
  const unknown = (L.rows || []).filter(x => x.source === 'none' && !(x.member in L.edits && L.edits[x.member])).length;
  const running = state.status && state.status.state === 'running';
  return h('div', { class: 'card', style: 'margin-top:16px' },
    h('h1', { style: 'font-size:17px' }, 'GitHub logins'),
    h('p', { class: 'muted', style: 'margin:0 0 10px;font-size:13px' }, 'The GitHub login of each person links their PRs, reviews and validations to their trigram; the lead’s also reads the reviews asked of you. It is deduced from the authors of their PRs: force it when it is wrong or unknown (written to github_logins in config.json).'),
    L.loading ? h('p', { class: 'muted' }, 'Loading…')
      : L.rows ? h('table', { class: 'logins' },
        h('thead', null, h('tr', null, ['Person', 'Login used', 'From', 'Force'].map(t => h('th', null, t)))),
        h('tbody', null, L.rows.map(x => {
          const [cls, text, title] = LOGIN_SOURCE[x.source] || LOGIN_SOURCE.none;
          const value = x.member in L.edits ? L.edits[x.member] : x.forced;
          return h('tr', { class: x.source === 'none' ? 'unknown' : null },
            h('td', null, h('span', { class: 'who' }, swatch(x.member), label(x.member)), x.member === (state.data?.squad?.lead || state.status?.config?.squad?.lead) ? h('span', { class: 'role-tag', style: 'margin-left:6px' }, 'lead') : null),
            h('td', null, x.login ? link(`https://github.com/${x.login}`, x.login) : h('span', { class: 'muted' }, '—'),
              x.rejected ? h('div', { class: 'muted small' }, `set aside: ${x.rejected}`) : null),
            h('td', null, h('span', { class: `rtag ${cls}`, title }, text), x.member in L.edits ? h('span', { class: 'muted small', style: 'margin-left:6px' }, 'modified') : null),
            h('td', null, h('span', { style: 'display:inline-flex;gap:4px;align-items:center' },
              h('input', { type: 'text', value, placeholder: x.login || 'GitHub login', spellcheck: 'false', autocomplete: 'off', 'aria-label': `GitHub login of ${label(x.member)}`,
                onchange: e => edit(x.member, e.target.value, x.forced) }),
              value ? h('button', { class: 'copy-btn', title: 'Stop forcing it: back to the deduced login', onclick: () => edit(x.member, '', x.forced) }, '×') : null)));
        })))
      : null,
    h('div', { class: 'actions', style: 'margin-top:14px' },
      h('button', { class: 'btn', disabled: !dirty || L.busy, onclick: () => save(false) }, 'Save'),
      h('button', { class: 'btn primary', disabled: !dirty || L.busy || running, title: 'Save, then read GitHub again with these logins', onclick: () => save(true) }, 'Save and read GitHub again'),
      h('span', { class: 'error' }, L.error || (unknown ? `${plural(unknown, 'login')} unknown` : ''))));
}

/* ---------- Plumbing: tabs, hash, live status, collection ---------- */
function hashFor(tab = state.tab) {
  const who = tab === 'journey' ? state.who : tab === 'work' ? state.work.who : null;
  return `#${tab}${who ? `/${who}` : ''}`;
}
function writeHash() {
  history.replaceState(null, '', hashFor());
}
function readHash() {
  const [tab, who] = location.hash.slice(1).split('/');
  if (TABS.some(t => t[0] === tab)) state.tab = tab;
  if (tab === 'journey') state.who = who || null;
  if (tab === 'work') state.work.who = who || null;
}
function navigate({ tab, who = null }) {
  state.tab = tab;
  if (tab === 'journey') state.who = who;
  if (tab === 'work') Object.assign(state.work, { who, limit: 60 });
  if (tab !== 'work') state.focus = null;
  history.pushState(null, '', hashFor());
  render_({ top: true });
}
// From a one-line item: the feature in Work, opened, within a period long enough to hold it.
function focusFeature(f, who) {
  const t = f.merged_at || lastActivity(f);
  const period = (PERIODS.find(([v]) => now() - t <= +v * DAY) || PERIODS.at(-1))[0];
  Object.assign(state.work, { period, role: 'all', status: 'all', q: '', view: 'list', reviewer: null });
  state.expanded.add(`work:${f.name}`);
  state.focus = f.name;
  navigate({ tab: 'work', who: everyone().includes(who) ? who : null });
  state.focus = null;
  const row = [...document.querySelectorAll('#tab-work .row[data-feature]')].find(el => el.dataset.feature === f.name);
  if (row) {
    (row.firstElementChild || row).scrollIntoView({ block: 'center' });
    row.classList.add('flash');
  }
}
addEventListener('popstate', () => { readHash(); state.focus = null; render_({ top: true }); });
function renderTabs() {
  const ready = !state.setup && state.data && state.data.squad;
  fill(document.getElementById('tabs'), ready ? TABS.map(([id, l]) => h('button', {
    class: `tab${id === 'me' ? ' me' : ''}`, role: 'tab', 'aria-selected': String(state.tab === id),
    onclick: () => navigate({ tab: id, who: id === 'journey' ? state.who : id === 'work' ? state.work.who : null }),
  }, id === 'me' ? [swatch(lead()), `Me · ${label(lead())}`] : l)) : []);
}
function render_({ top = false } = {}) {
  // Read before anything is hidden: a shorter page would clamp it to the top.
  const y = scrollY;
  hideTip();
  const ready = state.data && state.data.squad;
  document.getElementById('brand').textContent = ready ? `Squad ${label(lead())}` : 'Squad';
  document.title = ready ? `Squad ${label(lead())}` : 'Squad';
  renderTabs();
  const shown = state.setup || !ready ? 'setup' : `tab-${state.tab}`;
  for (const id of ['setup', 'tab-squad', 'tab-work', 'tab-journey', 'tab-me']) document.getElementById(id).hidden = id !== shown;
  if (shown === 'setup') {
    if (state.data || state.status) renderSetup();
  } else {
    ({ squad: renderSquad, work: renderWork, journey: renderJourney, me: renderMe })[state.tab]();
  }
  scrollTo(0, top ? 0 : y);
  renderLive();
}
// Older than a day, the squad's latest pushes, reviews and merges are missing: the page says so, with the way to update.
const STALE_AFTER = DAY;
function renderStale(d, st, running) {
  const banner = document.getElementById('stale');
  const fetched = Object.values(((d && d.sources && d.sources.git) || {}).fetched_at || {});
  const oldest = d ? Math.min(d.generated_at, ...fetched) : null;
  const stale = d && !running && now() - oldest > STALE_AFTER;
  const failed = !running && st.state === 'error';
  banner.hidden = !(stale || failed);
  if (banner.hidden) return false;
  fill(banner, h('span', { class: 'ico', 'aria-hidden': 'true' }, '!'),
    h('span', null, stale
      ? `${oldest === d.generated_at ? 'Data collected' : 'Last git fetch'} ${rel(oldest)} (${fdt(oldest)}): the latest pushes, reviews and merges of the squad are missing.`
      : 'The last update failed: the page shows the data of the one before.',
    failed && stale ? ' The last update failed too.' : '',
    failed && st.last_error ? h('span', { class: 'muted' }, ` ${st.last_error}`) : ''),
    state.server ? h('button', { class: 'btn', onclick: refreshAll }, '↻ Update now')
      : h('span', { class: 'muted' }, 'Start python3 collector.py, then open the address it prints to update.'));
  return stale;
}
// A newer version of the page on the remote of its clone, with the way to take it (the collector fast-forwards, then
// restarts on the new code).
function renderVersion() {
  const banner = document.getElementById('version-banner'), v = state.status && state.status.version;
  banner.hidden = !(v && v.behind > 0);
  if (banner.hidden) return;
  const manual = v.dirty || v.ahead;
  const notes = (v.notes || []).flatMap(n => n.items.map(item => `${n.version}: ${item}`));
  const first = notes[0] ? notes[0].replace(/^[^:]+: /, '') : (v.changes || [])[0];
  const more = notes.length ? notes.length > 1 : v.behind > 1;
  fill(banner, h('span', { class: 'ico', 'aria-hidden': 'true' }, '↑'),
    h('span', { title: (notes.length ? notes : v.changes || []).join('\n') },
      v.latest && v.version && v.latest !== v.version ? `Version ${v.latest} of this page is available (you have ${v.version})` : `A new version of this page is available: ${plural(v.behind, 'change')}`,
      first ? ` · ${first.replace(/[.\s]+$/, '')}${more ? '…' : '.'}` : '.'),
    manual ? h('span', { class: 'muted' }, 'This clone has local changes or commits: update it by hand with git pull.')
      : h('button', { class: 'btn', onclick: updateApp, disabled: state.status.state === 'running', title: 'git pull (fast-forward only), then the collector restarts on the new code' }, 'Update and restart'));
}
async function updateApp() {
  try {
    const res = await fetch('api/version?update', { method: 'POST' });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'refused');
    state.status = { ...(state.status || {}), version: body.version };
    if (!body.restarting) { toast('Already up to date'); renderLive(); return; }
    toast('Updating: the page reloads once the collector has restarted');
    // The collector restarts in the same process: wait until it has gone and come back, then load the new page.
    let gone = false;
    for (let i = 0; i < 90; i++) {
      await new Promise(r => setTimeout(r, 1000));
      try {
        const r = await fetch('api/status', { cache: 'no-store' });
        if (r.ok && (gone || i >= 8)) { location.reload(); return; }
      } catch (_) {
        gone = true;
      }
    }
    toast('The collector did not come back: start it again by hand');
  } catch (e) {
    toast(`Update failed: ${e.message === 'Failed to fetch' ? 'collector unreachable' : e.message}`);
  }
}
async function checkApp() {
  try {
    const res = await fetch('api/version?check', { method: 'POST' });
    const body = await res.json();
    state.status = { ...(state.status || {}), version: body.version };
    toast(body.version && body.version.behind ? `${plural(body.version.behind, 'change')} available` : body.version && body.version.error ? 'The remote could not be read' : 'Up to date');
  } catch (_) {
    toast('Collector unreachable');
  }
  renderLive();
  if (!document.getElementById('setup').hidden) renderSetup();
}
function appCard() {
  const v = state.status && state.status.version;
  if (!v || !v.checked) return null;
  const manual = v.dirty || v.ahead;
  const where = !v.clone ? 'This folder is no git clone: new versions cannot be known here (download it again to update).'
    : !v.upstream ? 'This clone has no upstream branch (git branch -u origin/master): new versions cannot be known.'
    : `Version ${v.version || '?'} (${v.head}) of ${v.upstream} · ${v.behind ? (v.latest && v.latest !== v.version ? `version ${v.latest} available` : `${plural(v.behind, 'change')} available`) : 'up to date'}${v.ahead ? ` · ${plural(v.ahead, 'local commit')}` : ''}${v.dirty ? ' · local changes' : ''} · checked ${rel(v.checked)}.`;
  return h('div', { class: 'card', style: 'margin-top:16px' },
    h('h1', { style: 'font-size:17px' }, 'This app'),
    h('p', { class: 'muted', style: 'margin:0;font-size:13px' }, where),
    v.error ? h('p', { class: 'error', style: 'margin:6px 0 0;font-size:13px' }, `The remote could not be read: ${v.error}`) : null,
    v.behind && v.notes && v.notes.length ? v.notes.map(n => [h('div', { class: 'muted small', style: 'margin-top:8px;font-weight:600' }, `What is new in ${n.version}`), h('ul', { class: 'app-changes', style: 'margin-top:2px' }, n.items.map(item => h('li', null, item)))])
      : v.behind && v.changes && v.changes.length ? h('ul', { class: 'app-changes' }, v.changes.map(c => h('li', null, c)), v.behind > v.changes.length ? h('li', { class: 'muted' }, `+ ${v.behind - v.changes.length} more`) : null) : null,
    manual && v.behind ? h('p', { class: 'muted', style: 'margin:6px 0 0;font-size:13px' }, 'Local changes or commits: update by hand with git pull, nothing is overwritten from here.') : null,
    v.upstream ? h('div', { class: 'actions', style: 'margin-top:14px' },
      h('button', { class: 'btn', onclick: checkApp }, 'Check now'),
      h('button', { class: 'btn primary', disabled: !v.behind || manual || (state.status && state.status.state === 'running'), onclick: updateApp,
        title: 'git pull (fast-forward only), then the collector restarts on the new code' }, 'Update and restart')) : null);
}

function renderLive() {
  const live = document.getElementById('live'), txt = document.getElementById('live-text');
  const st = state.status || {}, d = state.data, running = st.state === 'running';
  const stale = renderStale(d, st, running);
  renderVersion();
  live.className = `live ${running ? 'running' : st.state === 'error' ? 'error' : stale ? 'stale' : d ? 'ok' : ''}`;
  if (running) txt.textContent = `Collecting${st.step ? `: ${st.step}` : ''}…`;
  else if (!d) txt.textContent = state.server ? 'No data yet' : 'Collector not running';
  else txt.textContent = `Data from ${fdt(d.generated_at)} (${rel(d.generated_at)})${state.server ? '' : ' · offline'}${st.state === 'error' ? ' · last collection failed' : ''}`;
  live.title = st.state === 'error' ? st.last_error || '' : '';
  const b = document.getElementById('refresh');
  b.disabled = !state.server || running;
  b.title = state.server ? 'git fetch, runbot, mergebot and GitHub' : 'Start python3 collector.py, then open the address it prints';
}
function setData(data) {
  state.data = prepare(data);
  render_();
}
async function loadData() {
  const res = await fetch('api/data', { cache: 'no-store' });
  const body = await res.json();
  if (!body.pending) setData(body);
}
async function fetchStatus() {
  try {
    const res = await fetch('api/status', { cache: 'no-store' });
    state.server = res.ok;
    state.status = res.ok ? await res.json() : null;
  } catch (_) {
    state.server = false;
    state.status = null;
  }
  renderLive();
}
async function waitForCollection(after = loadData, done = 'Data updated') {
  while (true) {
    await new Promise(r => setTimeout(r, 1000));
    await fetchStatus();
    if (!state.server) return;
    if (state.status.state !== 'running') {
      if (state.status.state === 'error') toast(`Update failed: ${state.status.last_error || 'see the collector’s terminal'}`);
      else { await after(); toast(done); }
      return;
    }
  }
}
// The short reload of Me: GitHub's review requests alone, a few seconds, the rest of the data as it was.
async function reloadRequests() {
  try {
    await fetch('api/refresh?scope=me', { method: 'POST' });
    state.status = { ...(state.status || {}), state: 'running', scope: 'me', step: 'review requests' };
    renderLive();
    render_();
    await waitForCollection(async () => {
      const res = await fetch('api/requests', { cache: 'no-store' });
      const body = await res.json();
      if (body.review_requests) {
        state.data.review_requests = { ...body.review_requests, prs: body.review_requests.prs.map(r => ({ teams: [], ids: {}, validations: [], rplus: [], other_teams: 0, ...r })) };
      }
      await loadTodos();
      render_();
    }, 'Review requests and to-dos reloaded');
  } catch (_) {
    toast('Server unreachable');
  }
  render_();
}
async function refreshAll() {
  try {
    await fetch('api/refresh?scope=all', { method: 'POST' });
    state.status = { ...(state.status || {}), state: 'running', step: 'starting' };
    renderLive();
    await waitForCollection();
  } catch (_) {
    toast('Server unreachable');
  }
}
document.getElementById('refresh').addEventListener('click', refreshAll);
document.getElementById('setup-open').addEventListener('click', () => { state.setup = true; state.setupForm = null; state.logins = null; render_({ top: true }); });
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (_) { /* storage unavailable */ }
});
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) { /* storage unavailable */ }

async function init() {
  readHash();
  if (window.DASHBOARD_DATA) state.data = prepare(window.DASHBOARD_DATA);
  await fetchStatus();
  if (state.server && state.status.data_at && (!state.data || state.status.data_at > state.data.generated_at)) await loadData();
  // The squad may be saved in config.json before any collection carried it into the data.
  if (state.data && !state.data.squad && state.status && state.status.config && state.status.config.squad) state.data.squad = state.status.config.squad;
  await loadTodos();
  render_();
  if (state.server && state.status.state === 'running') waitForCollection();
}
init();
setInterval(renderLive, 60000);
// The version of the page and the state of the collector, read again now and then.
setInterval(() => { if (state.server && !(state.status && state.status.state === 'running')) fetchStatus(); }, 15 * 60 * 1000);
</script>
